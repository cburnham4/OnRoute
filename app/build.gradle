plugins {
    id 'com.android.application'
}

// Load keystore properties if available (optional for local builds without signing)
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
def hasKeystoreConfig = keystorePropertiesFile.exists()
if (hasKeystoreConfig) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

// Maps / Places / Directions API key — keep out of git.
// Set MAPS_API_KEY in local.properties (gitignored) or as a Gradle property.
def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localProperties.load(new FileInputStream(localPropertiesFile))
}
def mapsApiKey = localProperties.getProperty(
        "MAPS_API_KEY",
        project.findProperty("MAPS_API_KEY") ?: "YOUR_MAPS_API_KEY_HERE"
)

android {
    namespace 'letshangllc.onroute'
    compileSdk 36

    if (hasKeystoreConfig) {
        signingConfigs {
            release {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    defaultConfig {
        applicationId "letshangllc.onroute"
        minSdk 24
        targetSdk 36
        versionCode 100
        versionName "3.0.0"
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'

        // Injected into AndroidManifest meta-data and as a string resource.
        // Required Google Cloud APIs on this key: Maps SDK for Android, Places API, Directions API.
        resValue "string", "google_maps_key", mapsApiKey
        buildConfigField "String", "MAPS_API_KEY", "\"${mapsApiKey}\""
    }

    buildTypes {
        debug {
            // Debug uses the same MAPS_API_KEY from local.properties when present.
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasKeystoreConfig) {
                signingConfig signingConfigs.release
            }
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError true
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.fragment:fragment:1.8.5'

    // Maps + location (scoped; do not pull in full play-services)
    implementation 'com.google.android.gms:play-services-maps:19.0.0'
    implementation 'com.google.android.gms:play-services-location:21.3.0'

    // Places SDK (replaces deprecated Places Geo Data / Place Detection APIs)
    implementation 'com.google.android.libraries.places:places:3.5.0'

    // Google Directions routing (HTTPS; requires Directions API key)
    implementation 'com.github.jd-alexander:Google-Directions-Android:v1.1.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
